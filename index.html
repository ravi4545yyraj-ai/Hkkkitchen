<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HK KITCHEN</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #f4f4f4; padding-bottom: 90px; }
        .header { background: #d32f2f; color: white; padding: 12px; text-align: center; font-size: 20px; font-weight: bold; }
        .container { padding: 10px; max-width: 800px; margin: 0 auto; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card { background: white; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 2px 5px rgba(0,0,0,0.08); }
        .card img { width: 100%; height: 110px; object-fit: cover; border-radius: 8px; }
        .title { font-weight: bold; font-size: 14px; margin-top: 5px; }
        .desc { font-size: 11px; color: #666; margin: 3px 0; }
        .add-btn { background: #d32f2f; color: white; border: none; padding: 8px; border-radius: 6px; font-weight: bold; width: 100%; margin-top: 5px; cursor: pointer; }
        .add-btn:disabled { background: #ccc; }

        .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #212121; color: white; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; }
        .checkout-btn { background: #25D366; color: white; border: none; padding: 10px 15px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">HK KITCHEN</div>

    <div class="container">
        <div class="grid" id="menu-grid">
            <p>मेन्यू लोड हो रहा है...</p>
        </div>
    </div>

    <div class="cart-bar">
        <div>कुल आइटम: <span id="total-count">0</span></div>
        <button class="checkout-btn" onclick="sendWhatsApp()">WhatsApp पर ऑर्डर भेजें ➔</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCKBEH0DI5yUrnB0DINS6VpB9Q9nVjlUcE",
            authDomain: "hk-kitchen.firebaseapp.com",
            projectId: "hk-kitchen",
            storageBucket: "hk-kitchen.firebasestorage.app",
            messagingSenderId: "957964272552",
            appId: "1:957964272552:web:c01ac54a451aae3ae4939d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let cart = [];

        onSnapshot(collection(db, "menu"), (snapshot) => {
            const grid = document.getElementById('menu-grid');
            grid.innerHTML = '';
            snapshot.forEach((doc) => {
                const item = doc.data();
                grid.innerHTML += `
                    <div class="card">
                        <img src="${item.image}">
                        <div>
                            <div class="title">${item.name}</div>
                            <div class="desc">${item.desc || ''}</div>
                        </div>
                        <button class="add-btn" ${!item.inStock ? 'disabled' : ''} onclick="addToCart('${item.name}')">
                            ${item.inStock ? '+ जोड़ें' : 'Out of Stock'}
                        </button>
                    </div>
                `;
            });
        });

        window.addToCart = function(name) {
            cart.push(name);
            document.getElementById('total-count').innerText = cart.length;
        }

        window.sendWhatsApp = function() {
            if(cart.length === 0) return alert("कार्ट खाली है!");
            let msg = "*HK KITCHEN ऑर्डर*\n---\n";
            cart.forEach(i => msg += `• ${i}\n`);
            window.open(`https://wa.me/910000000000?text=${encodeURIComponent(msg)}`);
        }
    </script>
</body>
</html>
