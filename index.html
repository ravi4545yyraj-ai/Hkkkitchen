<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HK Kitchen - Online Menu</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen pb-24">

    <!-- Header -->
    <header class="bg-red-600 text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center">
        <h1 class="text-xl font-bold"><i class="fa-solid fa-utensils mr-2"></i> HK KITCHEN</h1>
        <a href="admin.html" class="text-xs bg-red-700 px-3 py-1.5 rounded-full font-medium hover:bg-red-800"><i class="fa-solid fa-lock mr-1"></i> एडमिन लॉगिन</a>
    </header>

    <!-- Banner / Store Info -->
    <div class="bg-white p-4 shadow-sm mb-4">
        <h2 class="text-lg font-bold text-gray-800">Welcome to HK Kitchen 🍲</h2>
        <p class="text-sm text-gray-500">घर का जैसा स्वादिष्ट खाना, सीधे आपके दरवाजे पर!</p>
    </div>

    <!-- Menu Section -->
    <div class="max-w-md mx-auto px-4">
        <h3 class="font-bold text-gray-700 mb-3 text-lg"><i class="fa-solid fa-burger mr-2 text-red-500"></i>Our Menu</h3>
        <div id="menu-list" class="space-y-3">
            <!-- Dynamic Items will load here -->
            <p class="text-center text-gray-400 py-10">मेन्यू लोड हो रहा है...</p>
        </div>
    </div>

    <!-- Floating Footer Cart / WhatsApp Order -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-3 shadow-lg flex justify-between items-center max-w-md mx-auto z-50">
        <div>
            <span class="text-xs text-gray-500 block">कुल आइटम चुने गए:</span>
            <span id="cart-count" class="font-bold text-gray-800">0</span>
        </div>
        <button onclick="sendWhatsAppOrder()" class="bg-green-600 text-white px-5 py-2.5 rounded-lg font-bold text-sm shadow hover:bg-green-700 flex items-center">
            <i class="fa-brands fa-whatsapp text-lg mr-2"></i> WhatsApp पर ऑर्डर भेजें
        </button>
    </div>

    <!-- Firebase Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Config (Tera purana config yahan hai)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let cart = {};

        async function loadMenu() {
            const menuContainer = document.getElementById('menu-list');
            menuContainer.innerHTML = '';
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                if(querySnapshot.empty) {
                    menuContainer.innerHTML = '<p class="text-center text-gray-400 py-10">अभी कोई आइटम उपलब्ध नहीं है।</p>';
                    return;
                }
                querySnapshot.forEach((doc) => {
                    const item = doc.data();
                    const itemCard = `
                        <div class="bg-white p-3 rounded-xl shadow-xs border border-gray-100 flex items-center gap-3">
                            <img src="${item.image || 'https://via.placeholder.com/80'}" class="w-20 h-20 object-cover rounded-lg bg-gray-100">
                            <div class="flex-1">
                                <h4 class="font-bold text-gray-800 text-sm">${item.name}</h4>
                                <p class="text-xs text-gray-500 mb-1">${item.desc || ''}</p>
                                <span class="font-bold text-red-600 text-sm">₹${item.price}</span>
                            </div>
                            <button onclick="addToCart('${item.name}', ${item.price})" class="bg-red-50 text-red-600 px-3 py-1.5 rounded-lg font-bold text-xs border border-red-200 active:bg-red-100">
                                जोड़ें +
                            </button>
                        </div>
                    `;
                    menuContainer.innerHTML += itemCard;
                });
            } catch (error) {
                console.error("Error loading menu:", error);
            }
        }

        window.addToCart = function(name, price) {
            if(!cart[name]) cart[name] = { price: price, qty: 0 };
            cart[name].qty += 1;
            updateCartCount();
        }

        function updateCartCount() {
            let total = Object.values(cart).reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('cart-count').innerText = total;
        }

        window.sendWhatsAppOrder = function() {
            let msg = "Hello HK Kitchen, mujhe yeh order bhejna hai:\n\n";
            let totalAmount = 0;
            for(let [name, data] of Object.entries(cart)) {
                if(data.qty > 0) {
                    msg += `- ${name} x ${data.qty} = ₹${data.price * data.qty}\n`;
                    totalAmount += data.price * data.qty;
                }
            }
            if(totalAmount === 0) {
                alert("कृपया पहले कम से कम एक आइटम चुनें!");
                return;
            }
            msg += `\n*Total Amount: ₹${totalAmount}*`;
            let phone = "919876543210"; // Apna WhatsApp Number yahan daal lena
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        loadMenu();
    </script>
</body>
</html>
